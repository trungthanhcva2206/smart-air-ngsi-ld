spring:
  application:
    name: smartair

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:docker}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartair_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${MYSQL_USER:smartair}
    password: ${MYSQL_PASSWORD:REPLACE_WITH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${SPRING_REACTOR_NETTY_POOL_MAX_CONNECTIONS:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:redis-cache}
      port: ${REDIS_PORT:6379}
      timeout: 60000ms

  cache:
    type: redis
    redis:
      time-to-live: 3600000

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:you@example.com}
    password: ${SPRING_MAIL_PASSWORD:REPLACE_WITH_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

backend:
  url: ${BACKEND_URL:http://host.docker.internal:8123}

notification:
  alert:
    throttle:
      minutes: ${NOTIFICATION_ALERT_THROTTLE_MINUTES:180}

springdoc:
  packages-to-scan: org.opensource.smartair.controllers
  paths-to-match: /api/open/**
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
    layout: BaseLayout
  api-docs:
    path: /v3/api-docs
    enabled: true
  servers:
    - url: ${SPRINGDOC_SERVER_LOCAL:http://localhost:8123}
      description: Local Development

server:
  port: ${SERVER_PORT:8123}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
  error:
    include-message: always
    include-stacktrace: on_param
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

app:
  frontend:
    url: ${FRONTEND_PUBLIC_URL:http://localhost:5137}

  fiware:
    orion:
      url: ${ORION_LD_URL:http://orion:1026}
      tenant: ${ORION_LD_TENANT:hanoi}
      service-path: ${ORION_SERVICE_PATH:/}
    quantumleap:
      url: ${QUANTUMLEAP_EXTERNAL_URL:http://quantumleap:8668}
      service: ${QUANTUMLEAP_FIWARE_SERVICE:hanoi}
      query:
        last-n: ${QUANTUMLEAP_QUERY_LASTN:720}
        delay-seconds: ${QUANTUMLEAP_QUERY_DELAY_SECONDS:2}
    iot-agent:
      url: ${IOT_AGENT_URL:http://iot-agent:4041}
      api-key: ${FIWARE_API_KEY:hanoi}

  security:
    jwt:
      secret: ${JWT_SECRET:REPLACE_WITH_JWT_SECRET}
      expiration: ${JWT_EXPIRATION:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5137}

  email:
    from-name: ${MAIL_FROM_NAME:Smart Air Quality Alert System}

spring:
  webflux:
    client:
      connect-timeout: ${SPRING_WEBFLUX_CLIENT_CONNECT_TIMEOUT:10000}
      read-timeout: ${SPRING_WEBFLUX_CLIENT_READ_TIMEOUT:30000}
      write-timeout: ${SPRING_WEBFLUX_CLIENT_WRITE_TIMEOUT:30000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.opensource.smartair: DEBUG
    org.springframework.web: INFO
    org.springframework.boot: INFO
    org.springframework.security: DEBUG
    org.hibernate: INFO
    com.zaxxer.hikari: INFO

quantumleap:
  url: ${QUANTUMLEAP_EXTERNAL_URL:http://quantumleap:8668}
  fiware-service: ${QUANTUMLEAP_FIWARE_SERVICE:hanoi}
  query:
    lastN: ${QUANTUMLEAP_QUERY_LASTN:720}
    delay:
      seconds: ${QUANTUMLEAP_QUERY_DELAY_SECONDS:2}

orion:
  url: ${ORION_LD_URL:http://orion:1026}
  tenant: ${ORION_LD_TENANT:hanoi}
  service-path: ${ORION_SERVICE_PATH:/}