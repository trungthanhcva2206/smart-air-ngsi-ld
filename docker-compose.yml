version: "3.8"

services:
  # ========================================
  # 🛡️ MongoDB (SECURED)
  # ========================================
  mongo-db:
    image: mongo:4.4
    hostname: mongo-db
    container_name: db-mongo
    ports:
      # CHỈ cho phép localhost truy cập
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-db-data:/data/db
      - mongo-db-config:/data/configdb
    environment:
      # Lấy user/pass từ .env
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=orion
    command: --nojournal
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    
  # ========================================
  # 📡 Mosquitto MQTT (AUTO-CONFIG WITH ENV)
  # ========================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    hostname: mosquitto
    container_name: mqtt-mosquitto
    ports:
      # Mở ra Internet (Lấy port từ biến env)
      - "${MQTT_BROKER_PORT:-1883}:1883"
      # WebSocket nội bộ
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    
    # Truyền biến môi trường vào container để script dùng
    environment:
      - MQTT_USER=${MQTT_USERNAME}
      - MQTT_PASS=${MQTT_PASSWORD}

    # Script tự tạo user/pass dựa trên biến .env
    entrypoint:
      - sh
      - -c
      - |
        # Dùng $$ để escape biến trong docker-compose, trỏ tới biến môi trường bên trong container
        mosquitto_passwd -c -b /mosquitto/config/passwd "$$MQTT_USER" "$$MQTT_PASS"
        echo "Starting Mosquitto with auto-generated password for user: $$MQTT_USER"
        /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf

    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-u", "${MQTT_USERNAME}", "-P", "${MQTT_PASSWORD}", "-t", "test", "-m", "test"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # 🔌 FIWARE IoT Agent JSON
  # ========================================
  iot-agent:
    image: fiware/iotagent-json:latest
    hostname: iot-agent
    container_name: fiware-iot-agent
    depends_on:
      - mongo-db
      - mosquitto
      - orion
    ports:
      - "127.0.0.1:4041:4041"
      - "127.0.0.1:${IOT_AGENT_HTTP_PORT:-7896}:7896"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_HOST=mongo-db
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagent
      # Auth Mongo từ .env
      - IOTA_MONGO_USER=${MONGO_INITDB_ROOT_USERNAME}
      - IOTA_MONGO_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - IOTA_HTTP_PORT=${IOT_AGENT_HTTP_PORT:-7896}
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=${MQTT_BROKER_PORT:-1883}
      - IOTA_MQTT_PROTOCOL=mqtt
      # Auth MQTT từ .env
      - IOTA_MQTT_USERNAME=${MQTT_USERNAME}
      - IOTA_MQTT_PASSWORD=${MQTT_PASSWORD}
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_TIMESTAMP=true
      - IOTA_AUTOCAST=true
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - IOTA_JSON_LD_CONTEXT=https://raw.githubusercontent.com/smart-data-models/dataModel.Environment/master/context.jsonld
      - IOTA_FALLBACK_TENANT=${FIWARE_SERVICE:-hanoi}

  # ========================================
  # 🧠 Orion-LD Context Broker
  # ========================================
  orion:
    image: fiware/orion-ld:latest
    hostname: orion
    container_name: fiware-orion
    depends_on:
      - mongo-db
    ports:
      - "127.0.0.1:1026:1026"
    environment:
      - ORIONLD_MONGO_HOST=mongo-db
      - ORIONLD_MONGO_DB=orion
      # Auth Mongo từ .env
      - ORIONLD_MONGO_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - ORIONLD_MONGO_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - ORIONLD_PORT=1026
      - ORIONLD_MULTI_SERVICE=TRUE
      - ORIONLD_DISABLE_FILE_LOG=TRUE
      - ORIONLD_LOG_LEVEL=INFO
    command: -dbhost mongo-db -logLevel INFO -forwarding
    healthcheck:
      test: curl --fail -s http://localhost:1026/version || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # 📈 QuantumLeap
  # ========================================
  quantumleap:
    image: orchestracities/quantumleap:1.0.0
    hostname: quantumleap
    container_name: fiware-quantumleap
    depends_on:
      - timescale-db
      - redis-cache
    ports:
      - "127.0.0.1:8668:8668"
    environment:
      - QL_DEFAULT_DB=timescale
      - POSTGRES_HOST=timescale-db
      - POSTGRES_PORT=5432
      # Lấy từ .env
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_DB_USER=${POSTGRES_USER}
      - POSTGRES_DB_PASS=${POSTGRES_PASSWORD}
      - POSTGRES_USE_SSL=False
      - USE_GEOCODING=False
      - CACHE_QUERIES=True
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - LOGLEVEL=INFO
    healthcheck:
      test: curl --fail -s http://localhost:8668/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # 🗄️ TimescaleDB (SECURED)
  # ========================================
  timescale-db:
    image: timescale/timescaledb-ha:pg15-latest
    hostname: timescale-db
    container_name: db-timescale
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      # Lấy từ .env
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - timescale-db-data:/var/lib/postgresql/data
      - ./init-postgis.sh:/docker-entrypoint-initdb.d/01-init-postgis.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # 🚀 Redis Cache (NO PASSWORD - Internal Only)
  # ========================================
  redis-cache:
    image: redis:7-alpine
    hostname: redis-cache
    container_name: cache-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-cache-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # 📊 Grafana
  # ========================================
  grafana:
    image: grafana/grafana:10.2.2
    hostname: grafana
    container_name: grafana
    depends_on:
      - timescale-db
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      # Lấy từ .env
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=${GRAFANA_PUBLIC_URL}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ========================================
  # 🐬 MySQL Database (SECURED)
  # ========================================
  mysql-db:
    image: mysql:8.0
    hostname: mysql-db
    container_name: db-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      # Lấy từ .env
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-db-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # ========================================
  # 🛠️ IoT Provisioning
  # ========================================
  iot-provisioning:
    image: ubuntu:22.04
    container_name: iot-provisioning
    volumes:
      - ./iot-agent-provisioning.sh:/scripts/provision.sh
    command: >
      bash -c "apt update && apt install -y curl sed coreutils && bash /scripts/provision.sh"
    depends_on:
      - iot-agent
      - orion
    restart: "no"
  
  # ========================================
  # 🔄 ETL Pipeline Service
  # ========================================
  etl-pipeline:
    build:
      context: .
      dockerfile: etl/Dockerfile
    image: smart-air-etl:latest
    container_name: smart-air-etl
    depends_on:
      iot-provisioning:
        condition: service_completed_successfully
      orion:
        condition: service_healthy
      quantumleap:
        condition: service_healthy
    environment:
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - ORION_LD_URL=${ORION_LD_URL}
      - ORION_LD_TENANT=${ORION_LD_TENANT}
      - QUANTUMLEAP_EXTERNAL_URL=${QUANTUMLEAP_EXTERNAL_URL}
      - QUANTUMLEAP_INTERNAL_URL=${QUANTUMLEAP_INTERNAL_URL}
      - QUANTUMLEAP_ENABLED=${QUANTUMLEAP_ENABLED}
      - ETL_MODE=${ETL_MODE}
      - ETL_INTERVAL_MINUTES=${ETL_INTERVAL_MINUTES}
      - LOG_LEVEL=${LOG_LEVEL}
      - HANOI_GEOJSON_PATH=${HANOI_GEOJSON_PATH}
      
      # MQTT Auth (Lấy từ .env)
      - MQTT_BROKER_HOST=mosquitto
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
    volumes:
      - etl-logs:/app/logs
    restart: unless-stopped
    
  # ========================================
  # 🗺️ Route-Finding Service
  # ========================================
  route-finding:
    build:
      context: .
      dockerfile: route-finding/Dockerfile
    image: smart-air-route-finding:latest
    hostname: route-finding
    container_name: smart-air-route-finding
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${ROUTE_FINDING_PORT:-5000}:5000"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - FLASK_HOST=${FLASK_HOST}
      - FLASK_PORT=${FLASK_PORT}
      - FLASK_DEBUG=${FLASK_DEBUG}
      - BACKEND_URL=${BACKEND_DOCKER_URL}
      - SSE_ENDPOINT=${SSE_ENDPOINT_DOCKER}
      - GRAPH_FILE=${GRAPH_FILE}
      - GEOJSON_FILE=${GEOJSON_FILE}
      - LOG_LEVEL=${LOG_LEVEL}
      - CACHE_ENABLED=True
      - CACHE_TTL=3600
    volumes:
      - ./route-finding:/app
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - route-finding-cache:/app/cache
      - ./route-finding/${GRAPH_FILE}:/app/${GRAPH_FILE}:ro
      - ./route-finding/${GEOJSON_FILE}:/app/${GEOJSON_FILE}:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ========================================
  # ☕ Spring Boot Backend API
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smart-air-backend:latest
    hostname: backend
    container_name: smart-air-backend
    depends_on:
      mysql-db:
        condition: service_healthy
      orion:
        condition: service_healthy
      quantumleap:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8123}:8123"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SERVER_PORT=${BACKEND_PORT}
      
      # Database
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      
      # Redis Config (No Auth)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      
      # FIWARE Configs
      - ORION_LD_URL=${ORION_LD_URL}
      - ORION_LD_TENANT=${ORION_LD_TENANT}
      - ORION_SERVICE_PATH=${ORION_SERVICE_PATH}
      - QUANTUMLEAP_EXTERNAL_URL=${QUANTUMLEAP_EXTERNAL_URL}
      - QUANTUMLEAP_FIWARE_SERVICE=${QUANTUMLEAP_FIWARE_SERVICE}
      - QUANTUMLEAP_QUERY_LASTN=${QUANTUMLEAP_QUERY_LASTN}
      - QUANTUMLEAP_QUERY_DELAY_SECONDS=${QUANTUMLEAP_QUERY_DELAY_SECONDS}
      - IOT_AGENT_URL=${IOT_AGENT_DOCKER_URL}
      - FIWARE_SERVICE=${FIWARE_SERVICE}
      - FIWARE_API_KEY=${FIWARE_API_KEY}
      
      # Email
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      
      # Security & Web
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - FRONTEND_PUBLIC_URL=${FRONTEND_PUBLIC_URL}
      
      # WebFlux Timeouts
      - SPRING_WEBFLUX_CLIENT_CONNECT_TIMEOUT=${SPRING_WEBFLUX_CLIENT_CONNECT_TIMEOUT}
      - SPRING_WEBFLUX_CLIENT_READ_TIMEOUT=${SPRING_WEBFLUX_CLIENT_READ_TIMEOUT}
      - SPRING_WEBFLUX_CLIENT_WRITE_TIMEOUT=${SPRING_WEBFLUX_CLIENT_WRITE_TIMEOUT}
      
      - LOG_LEVEL=${LOG_LEVEL}
      - JAVA_OPTS=-Xmx1024m -Xms512m -XX:+UseG1GC
    volumes:
      - backend-logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
  
  # ========================================
  # 📱 Blynk & Telegram Notification Service
  # ========================================
  blynk-notification:
    build:
      context: .
      dockerfile: ./BlynkNotification/Dockerfile
    image: smart-air-blynk:latest
    container_name: smart-air-blynk
    hostname: blynk-notification
    depends_on:
      orion:
        condition: service_healthy
    ports:
      - "${WEBHOOK_PORT:-4999}:4999"
    environment:
      - FLASK_APP=services/notification_service.py
      - FLASK_ENV=production
      - BLYNK_TOKEN=${BLYNK_TOKEN}
      - BLYNK_SERVER=${BLYNK_SERVER}
      - BLYNK_API_URL=${BLYNK_API_URL:-https://blynk.cloud/external/api}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - WEBHOOK_HOST=${WEBHOOK_HOST}
      - WEBHOOK_PORT=${WEBHOOK_PORT}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - ORION_LD_URL=${ORION_LD_URL}
      - ORION_LD_TENANT=${ORION_LD_TENANT}
      - ORION_SERVICE_PATH=${ORION_SERVICE_PATH}
      # Thresholds default
      - AIR_QUALITY_THRESHOLD_PM25=35.0
      - AIR_QUALITY_THRESHOLD_PM10=50.0
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - blynk-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4999/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  
  # ========================================
  # 🔐 Certbot
  # ========================================
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

  # ========================================
  # 🎨 Frontend
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_API_ROUTE_URL=${VITE_API_ROUTE_URL}
    image: smart-air-frontend:latest
    hostname: frontend
    container_name: smart-air-frontend
    depends_on:
      backend:
        condition: service_healthy
      route-finding:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "443:443"
    environment:
      - NGINX_HOST=${DOMAIN}
      - NGINX_PORT=80
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro        
      - ./certbot/www:/var/www/certbot:ro         
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.project=smart-air"
      - "com.docker.compose.service=frontend"

volumes:
  mongo-db-data:
    driver: local
  mongo-db-config:
    driver: local
  timescale-db-data:
    driver: local
  redis-cache-data:
    driver: local
  grafana-data:
    driver: local
  mysql-db-data:
    driver: local
  route-finding-cache:    
    driver: local
  etl-logs:
    driver: local
  backend-logs:
    driver: local
  blynk-logs:
    driver: local
  frontend-logs:  
    driver: local
  certbot-conf:    
    driver: local
  certbot-www:    
    driver: local

networks:
  default:
    name: fiware-network
    driver: bridge