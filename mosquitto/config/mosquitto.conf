# Mosquitto MQTT Broker Configuration
# For FIWARE IoT Agent JSON

# Network - Listen on all interfaces
listener 1883
protocol mqtt

# WebSocket support
listener 9001
protocol websockets

# =============================================================
# 🔒 SECURITY SETTINGS (QUAN TRỌNG: ĐÃ SỬA)
# =============================================================

# Cấm truy cập ẩn danh (Bắt buộc phải có user/pass)
allow_anonymous false

# Đường dẫn file mật khẩu (File này sẽ tạo ở bước 2)
password_file /mosquitto/config/passwd

# =============================================================

# Logging
log_dest stdout
log_type all
log_timestamp true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Message size limit (10MB for large payloads)
message_size_limit 10485760

# Connection settings
max_keepalive 60
max_connections -1